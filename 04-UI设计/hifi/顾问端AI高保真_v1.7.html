<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>顾问端 AI 高保真 v1.7（销售·诉求·培训·查询·综合方案）</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23AF2D67'/%3E%3Cstop offset='1' stop-color='%23002661'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cpath d='M8 20l5-6 4 3 7-9' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
:root{
  --navy:#002661;--navy-700:#1E3E78;--navy-100:#DCE4F2;--navy-50:#EDF1F8;
  --berry:#AF2D67;--berry-50:#FAEEF4;
  --grad:linear-gradient(132deg,#AF2D67 0%,#5E246B 46%,#002661 100%);
  --ink:#1B2433;--mut:#5E6B7E;--faint:#8A95A6;--line:#E5E9F0;--line-2:#F0F3F8;--paper:#F5F7FA;
  --green:#177A5B;--green-bg:#E6F4EE;--amber:#B45309;--amber-bg:#FBF1E2;--red:#C03221;--red-bg:#FCEBEA;--blue:#1D5F8A;--blue-bg:#E9F2F8;
  --sh1:0 1px 2px rgba(16,32,67,.05),0 6px 18px -8px rgba(16,32,67,.12);--sh2:0 2px 6px rgba(16,32,67,.05),0 20px 44px -14px rgba(15,35,80,.22);
  --ease-out:cubic-bezier(.16,1,.3,1);--spring:cubic-bezier(.34,1.3,.5,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased;}
body{font-family:"Manrope","Noto Sans SC",-apple-system,"PingFang SC",sans-serif;background:#E9EDF3;color:var(--ink);min-height:100vh;}
.stage{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:34px 16px 60px;}
.stage-head{text-align:center;margin-bottom:22px;max-width:680px;}
.stage-head h1{font-size:20px;font-weight:800;}
.stage-head p{font-size:12.5px;color:var(--mut);margin-top:6px;line-height:1.7;}
.stage-head .pill{display:inline-block;font-size:11px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:4px 12px;color:var(--mut);margin-top:8px;}
.phone{width:390px;height:800px;border-radius:42px;background:#11262B;padding:11px;box-shadow:0 30px 70px rgba(10,25,60,.35);position:relative;flex:none;}
.screens{position:absolute;inset:11px;border-radius:32px;overflow:hidden;background:var(--paper);}
.view{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;opacity:0;pointer-events:none;transform:translateX(30px) scale(.985);transition:transform .42s cubic-bezier(.22,1,.36,1),opacity .3s ease;will-change:transform,opacity;}
.view.on{opacity:1;pointer-events:auto;transform:none;z-index:2;}
.body{flex:1 1 0;min-height:0;overflow-y:auto;padding:4px 18px 12px;scrollbar-width:none;-webkit-overview-scrolling:touch;}.body::-webkit-scrollbar{display:none;}
.tabbar{height:64px;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;flex:none;padding-bottom:6px;}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;color:var(--faint);text-decoration:none;cursor:pointer;}
.tabbar a.on{color:var(--navy);font-weight:700;}
.tabbar a svg{width:22px;height:22px;}
.card{background:#fff;border-radius:18px;box-shadow:var(--sh1);padding:16px;margin-bottom:12px;}
.btn{border:0;font-family:inherit;font-weight:700;border-radius:22px;height:46px;display:flex;align-items:center;justify-content:center;gap:7px;font-size:15px;cursor:pointer;transition:transform .18s var(--spring),box-shadow .25s;}
.btn:active{transform:scale(.962);}
.btn.navy{background:linear-gradient(180deg,#0B3A82,#002661);color:#fff;box-shadow:0 6px 18px rgba(0,38,97,.24),inset 0 1px 0 rgba(255,255,255,.16);}
.btn.berry{background:linear-gradient(180deg,#C63D80,#A5275F);color:#fff;box-shadow:0 6px 18px rgba(175,45,103,.26),inset 0 1px 0 rgba(255,255,255,.16);}
.btn.ghost{background:#fff;border:1.5px solid var(--navy);color:var(--navy);}
.btn.sm{height:36px;font-size:13px;border-radius:18px;padding:0 16px;}
.st{font-size:11px;font-weight:600;border-radius:7px;padding:3px 9px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;}
.st.g{background:var(--green-bg);color:var(--green);}.st.a{background:var(--amber-bg);color:var(--amber);}
.st.r{background:var(--red-bg);color:var(--red);}.st.b{background:var(--blue-bg);color:var(--blue);}
.appbar{display:flex;align-items:center;gap:10px;padding:8px 2px 12px;}
.appbar .bk{width:36px;height:36px;border-radius:50%;background:#fff;box-shadow:var(--sh1);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;}
.appbar .tt{font-size:17px;font-weight:700;flex:1;}
.sec-t{font-size:13px;font-weight:700;margin:16px 2px 10px;display:flex;justify-content:space-between;align-items:center;}
.sec-t span{font-size:11px;color:var(--faint);font-weight:600;}
.gradband{background:var(--grad);background-size:170% 170%;animation:drift 16s ease-in-out infinite alternate;color:#fff;border-radius:20px;padding:17px 18px;box-shadow:0 12px 28px rgba(94,36,107,.25);}
@keyframes drift{0%{background-position:0 30%}100%{background-position:100% 70%}}
.src{display:flex;gap:7px;align-items:flex-start;font-size:11px;color:var(--mut);border-top:1px dashed var(--line);margin-top:10px;padding-top:9px;}
.src .tag{font-size:10px;font-weight:800;border-radius:6px;padding:2px 7px;flex:none;}
.tag.off{background:var(--green-bg);color:var(--green);}.tag.co{background:var(--blue-bg);color:var(--blue);}.tag.sp{background:var(--amber-bg);color:var(--amber);}
.draftmark{display:inline-flex;font-size:10.5px;font-weight:800;background:var(--amber-bg);color:var(--amber);border-radius:7px;padding:3px 10px;}
.issue{display:flex;gap:10px;font-size:12.5px;padding:11px 2px;border-bottom:1px solid var(--line-2);line-height:1.65;align-items:center;}
.issue .ic{flex:none;width:22px;height:22px;border-radius:50%;font-size:11px;display:flex;align-items:center;justify-content:center;}
.issue .ic.r{background:var(--red-bg);color:var(--red);}.issue .ic.a{background:var(--amber-bg);color:var(--amber);}.issue .ic.g{background:var(--green-bg);color:var(--green);}
.sbox{display:flex;gap:11px;align-items:center;background:#fff;border-radius:15px;padding:13px 14px;margin-bottom:9px;box-shadow:var(--sh1);cursor:pointer;font-size:13px;transition:transform .2s var(--ease-out);}
.sbox:active{transform:scale(.97);}
.sbox .n{width:32px;height:32px;border-radius:10px;background:var(--navy-50);color:var(--navy);display:flex;align-items:center;justify-content:center;flex:none;font-size:13px;font-weight:800;}
.sbox .n.berry{background:var(--berry-50);color:var(--berry);}
.devnote{max-width:760px;margin:24px auto 0;background:#fff;border-radius:14px;box-shadow:var(--sh1);padding:15px 19px;font-size:12.5px;color:var(--mut);line-height:1.9;}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
.anchor{border:1.5px solid var(--navy-100);border-radius:14px;background:#fff;box-shadow:var(--sh1);padding:10px 13px;display:flex;gap:10px;align-items:center;margin-bottom:12px;cursor:pointer;}
.anchor .av{width:32px;height:32px;border-radius:50%;background:var(--navy-50);flex:none;}
.act{display:flex;gap:10px;align-items:center;background:#fff;border-radius:14px;padding:11px 13px;margin-bottom:9px;box-shadow:var(--sh1);cursor:pointer;font-size:12.5px;transition:transform .2s var(--ease-out);}
.act:active{transform:scale(.97);}
.act .rk{width:26px;height:26px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;}
.rk.r{background:var(--red-bg);color:var(--red);}.rk.a{background:var(--amber-bg);color:var(--amber);}.rk.b{background:var(--blue-bg);color:var(--blue);}
.draft{display:flex;gap:10px;align-items:flex-start;background:#fff;border-radius:14px;box-shadow:var(--sh1);padding:12px 14px;margin-bottom:9px;font-size:12.5px;line-height:1.7;}
.draft .ck{width:21px;height:21px;border:1.5px solid var(--line);border-radius:7px;flex:none;margin-top:1px;}
.ipadbox{border-radius:16px;background:#fff;box-shadow:var(--sh1);padding:13px;display:flex;gap:11px;min-height:240px;}
.stage-area{flex:1;border-radius:12px;background:var(--navy-50);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--mut);text-align:center;line-height:1.8;padding:14px;}
.hint-col{width:132px;border-radius:12px;background:var(--amber-bg);padding:11px;font-size:10.5px;color:var(--amber);line-height:1.8;}
</style>
</head>
<body>
<div class="stage">
  <div class="stage-head">
    <h1>顾问端 AI 高保真 · v1.7（销售推进 · 客户诉求 · 培训 · 资料查询 · 综合方案）</h1>
    <p>在 v1.6 基础上新增：销售机会管线、综合诉求方案、资料查询、培训中心；另有会前/iPad/会后/方案/回复/自检。<br>AI 始终锚定一位客户，只检索起草；顾问判断署名，AI 不是任何一只“眼”。</p>
    <span class="pill">点击页面元素切换</span>
  </div>
  <div class="phone"><div class="screens" id="root"></div></div>
  <div class="devnote" id="note"></div>
</div>
<script>
var ICONS={
 work:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',
 clients:'<circle cx="9" cy="8" r="3.5"/><path d="M3 20c1-3.5 4-5 6-5s5 1.5 6 5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 20c-.5-2.2-1.6-3.6-3-4.4"/>',
 cases:'<rect x="4" y="4" width="16" height="17" rx="2"/><path d="M8 9h8M8 13h5"/>',
 proposal:'<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h6M9 17h4"/>',
 me:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 5-6 8-6s6.5 2 8 6"/>'
};
function svg(n){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">'+ICONS[n]+'</svg>';}
function tabbar(active){
 var t=[['work','工作台'],['clients','客户'],['cases','案件'],['proposal','方案'],['me','我的']];
 return '<div class="tabbar">'+t.map(x=>'<a class="'+(active===x[0]?'on':'')+'" data-go="'+(x[0]==='work'?'morning':x[0])+'">'+svg(x[0])+'<span>'+x[1]+'</span></a>').join('')+'</div>';
}
function appbar(t){
 var chev='<svg viewBox="0 0 24 24" fill="none" stroke="#5E6B7E" stroke-width="2.2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg>';
 return '<div class="appbar"><div class="bk" data-go="morning">'+chev+'</div><div class="tt">'+t+'</div></div>';
}
function anchor(cust,stage,scope){
 return '<div class="anchor" data-go="anchor"><div class="av"></div><div style="flex:1;"><b style="font-size:13px;">当前客户：'+cust+'</b><div style="font-size:10.5px;color:var(--faint);margin-top:2px;">'+stage+' · 授权：'+scope+'</div></div><div style="font-size:11px;color:var(--faint);">切换</div></div>';
}
var V={};

V.morning='<div class="view"><div class="body">'+
 '<div style="padding:6px 2px 2px;"><div class="h-title">早上好，陈某</div><div class="h-sub">今日按风险排序 · 只升级提醒不改截止</div></div>'+
 '<div class="sec-t">风险雷达（3）</div>'+
 '<div class="act"><div class="rk r">!</div><div style="flex:1;font-size:12px;">CASE-A02 回执 T0 剩 4 小时，已转人工+主管</div></div>'+
 '<div class="act"><div class="rk a">?</div><div style="flex:1;font-size:12px;">c-2051 问“能否通过”，待你合规回应</div></div>'+
 '<div class="act"><div class="rk b">i</div><div style="flex:1;font-size:12px;">ORD-2407 凭证待核验（≠到账）</div></div>'+
 '<div class="sec-t">行动清单（按风险排序）</div>'+
 '<div class="act" data-go="postmeet"><div class="rk r">1</div><div style="flex:1;font-size:12px;">#1980 会后待收口（记录已暂存）</div><div class="btn sm fill">去处理</div></div>'+
 '<div class="act" data-go="premeet"><div class="rk a">2</div><div style="flex:1;font-size:12px;">10:30 会面 #2051，会前简报已就绪</div><div class="btn sm">查看</div></div>'+
 '<div class="act" data-go="proposal"><div class="rk b">3</div><div style="flex:1;font-size:12px;">PROP-312 两段缺来源，待补后自检</div></div><div class="sec-t">销售与能力</div><div class="act" data-go="pipeline"><div class="rk b">销</div><div style="flex:1;font-size:12px;">销售机会管线：6 个机会，2 个待推进</div></div><div class="act" data-go="compsolution"><div class="rk a">综</div><div style="flex:1;font-size:12px;">综合诉求方案：居留+子女+税务组合</div></div><div class="act" data-go="lookup"><div class="rk b">查</div><div style="flex:1;font-size:12px;">资料查询：政策/模板/费表/素材</div></div><div class="act" data-go="training"><div class="rk a">训</div><div style="flex:1;font-size:12px;">培训中心：1 门必修待完成</div></div>'+
 '</div>'+tabbar('work')+'</div>';

V.anchor='<div class="view">'+appbar('切换客户锚点')+'<div class="body">'+
 '<div class="card" style="padding:10px 13px;font-size:12px;color:var(--faint);">搜索客户（仅 active 主责）</div>'+
 [['#1980 材料准备',1],['#2051 方案阶段',1],['#2049 待接受',0],['#1902 交接中',0]].map(x=>'<div class="act"><div style="width:27px;height:27px;border-radius:50%;background:var(--line);flex:none;"></div><div style="flex:1;font-size:12px;">'+x[0]+'</div>'+(x[1]?'<span class="st g">可选</span>':'<span class="st r">不可操作</span>')+'</div>').join('')+
 '<div style="font-size:11px;color:var(--faint);line-height:1.7;">非主责 / 交接中 / 待接受客户不进入 AI 上下文。</div>'+
 '</div>'+tabbar('work')+'</div>';

V.premeet='<div class="view">'+appbar('会前简报 · #2051')+'<div class="body">'+
 anchor('#2051','方案阶段','技术居留 A')+
 '<div class="card"><div style="font-size:10.5px;color:var(--faint);font-weight:700;margin-bottom:8px;">自上次会面的变化</div><div style="font-size:12px;line-height:1.8;">客户补充了资产证明；新增提问“通过率”；无新费用。</div></div>'+
 '<div class="card"><div style="font-size:10.5px;color:var(--faint);font-weight:700;margin-bottom:8px;">预判问题 / 缺失材料 / 可讨论范围</div><div style="font-size:12px;line-height:1.9;">预判：周期、子女随行；<br>缺：无犯罪公证；<br>范围：授权内，不含结果承诺。</div></div>'+
 '<div class="card"><div style="font-size:10.5px;color:var(--faint);font-weight:700;margin-bottom:8px;">建议讲解动线（核准素材）</div><div style="font-size:12px;line-height:1.9;">需求确认 → 项目讲解卡 v3 → 费用说明对客版 → 下一步</div></div>'+
 '<div class="btn navy" style="width:100%;" data-go="ipad">进入 iPad 展业模式</div>'+
 '</div>'+tabbar('work')+'</div>';

V.ipad='<div class="view">'+appbar('iPad 展业模式 · 讲解伴侣')+'<div class="body">'+
 '<div class="ipadbox"><div class="stage-area">客户可见<br>核准讲解素材（全屏）</div>'+
 '<div class="hint-col"><b>顾问私有 · 默认收起</b><br><br>客户问“多久能办”：<br>以已发布内容说明参考区间，非承诺<br><br><span style="color:var(--red);">红线：不答结果</span></div></div>'+
 '<div style="font-size:11px;color:var(--faint);margin-top:10px;line-height:1.7;">提示层客户视角不可见；现场记录会后统一整理。</div>'+
 '<div class="btn fill" style="width:100%;margin-top:10px;" data-go="postmeet">会面结束 · 会后收口</div>'+
 '</div></div>';

V.postmeet='<div class="view">'+appbar('会后收口 · #1980')+'<div class="body">'+
 anchor('#1980','材料准备','技术居留 A')+
 '<div class="draft"><div class="ck"></div><div style="flex:1;"><b>跟进（fact）</b>：客户关注子女教育<div style="color:var(--faint);margin-top:3px;">另 1 条 internal 已分离</div></div></div>'+
 '<div class="draft"><div class="ck"></div><div style="flex:1;"><b>任务</b>：9-28 前补无犯罪公证（T0 · 合同）</div></div>'+
 '<div class="draft"><div class="ck"></div><div style="flex:1;"><b>对客消息</b>：材料清单与公证指引</div></div>'+
 '<div class="draft"><div class="ck"></div><div style="flex:1;"><b>方案待更新</b>：随子女教育安排补充说明</div></div>'+
 '<div style="display:flex;gap:9px;"><div class="btn ghost" style="flex:1;">弃用</div><div class="btn navy" style="flex:1;">逐条采纳并署名</div></div>'+
 '<div style="font-size:11px;color:var(--faint);margin-top:10px;line-height:1.7;">采纳后分别走词库 / T0 / 四眼，AI 不代行。</div>'+
 '</div>'+tabbar('work')+'</div>';

V.proposal='<div class="view">'+appbar('方案协作起草')+'<div class="body">'+
 anchor('#1980','材料准备','技术居留 A')+
 '<div class="card"><div style="font-size:10.5px;color:var(--faint);font-weight:700;margin-bottom:8px;">正文草稿</div><div style="font-size:12px;line-height:1.9;">建议申请技术居留 A；费用与步骤如下…<br><span style="color:var(--amber);">“办理较快”等两段缺来源，需删除或补引用</span></div></div>'+
 '<div class="card"><div style="font-size:10.5px;color:var(--faint);font-weight:700;margin-bottom:8px;">费项（只读快照）</div><div style="font-size:12px;line-height:2;">¥30,000 已确认 · USD 4,500 估算 · 官方费待确认</div></div>'+
 '<div class="btn berry" style="width:100%;" data-go="selfcheck">提交前合规自检</div>'+
 '</div>'+tabbar('proposal')+'</div>';

V.reply='<div class="view">'+appbar('建议回复')+'<div class="body">'+
 anchor('#1980','材料准备','技术居留 A')+
 '<div class="card"><div style="font-size:12px;line-height:1.8;">已受理，材料准备中，待补无犯罪公证；本周无新费用。</div>'+
 '<div class="src"><span class="tag off">已核验</span><span>受理回执 09-24</span></div></div>'+
 '<div class="card" style="background:var(--paper);box-shadow:none;border:1.5px dashed var(--line);font-size:11px;color:var(--faint);">等待 3 周 · 主动关怀：<b style="color:var(--amber);">无 co/off 新事实，不生成假更新</b></div>'+
 '<div style="display:flex;gap:9px;"><div class="btn ghost" style="flex:1;">弃用</div><div class="btn navy" style="flex:1;">确认发送</div></div>'+
 '</div>'+tabbar('clients')+'</div>';

V.selfcheck='<div class="view">'+appbar('提交前合规自检')+'<div class="body">'+
 '<div class="card" style="padding:5px 16px;"><div style="font-size:12.5px;line-height:2.1;"><span style="color:var(--red);">!</span> 非核准措辞 1 处<br><span style="color:var(--amber);">?</span> 缺来源 2 段<br><span style="color:var(--green);">✓</span> 费项一致、四眼资格满足</div></div>'+
 '<div class="btn berry" style="width:100%;">按清单修订</div>'+
 '<div style="font-size:11px;color:var(--faint);margin-top:10px;">自检不替代复核、不改变状态。</div>'+
 '</div>'+tabbar('proposal')+'</div>';

V.pipeline='<div class="view">'+appbar('销售机会管线')+'<div class="body">'+
