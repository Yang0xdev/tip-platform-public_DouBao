<style>
:root{
  --navy:#002661;--navy-700:#1E3E78;--navy-100:#DCE4F2;--navy-50:#EDF1F8;
  --berry:#AF2D67;--berry-50:#FAEEF4;
  --grad:linear-gradient(132deg,#AF2D67 0%,#5E246B 46%,#002661 100%);
  --ink:#1B2433;--mut:#5E6B7E;--faint:#8A95A6;--line:#E5E9F0;--line-2:#F0F3F8;--paper:#F5F7FA;
  --green:#177A5B;--green-bg:#E6F4EE;--amber:#B45309;--amber-bg:#FBF1E2;--red:#C03221;--red-bg:#FCEBEA;--blue:#1D5F8A;--blue-bg:#E9F2F8;--purple:#6B5AA8;--purple-bg:#EFECF7;

  --ease-out:cubic-bezier(.16,1,.3,1);--spring:cubic-bezier(.34,1.3,.5,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased;}
body{font-family:"Manrope","Noto Sans SC",-apple-system,"PingFang SC",sans-serif;background:#E9EDF3;color:var(--ink);min-height:100vh;}
.stage{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:34px 16px 60px;}
.stage-head{text-align:center;margin-bottom:22px;}
.stage-head h1{font-size:20px;font-weight:800;}
.stage-head p{font-size:12.5px;color:var(--mut);margin-top:6px;line-height:1.7;}
.stage-head .pill{display:inline-block;font-size:11px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:4px 12px;color:var(--mut);margin-top:8px;}
/* phone */
.phone{width:390px;height:800px;border-radius:42px;background:#11262B;padding:11px;box-shadow:0 30px 70px rgba(10,25,60,.35);position:relative;flex:none;}
.screen{width:100%;height:100%;border-radius:32px;background:var(--paper);overflow:hidden;position:relative;}
.screens{position:absolute;inset:11px;border-radius:32px;overflow:hidden;}
.view{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--paper);overflow:hidden;opacity:0;pointer-events:none;transform:translateX(28px);transition:transform .34s var(--ease-out),opacity .26s var(--ease-out);}
.view.on{opacity:1;pointer-events:auto;transform:none;z-index:2;}
.view.back{transform:translateX(-18px);}
.sb{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:12px;font-weight:600;color:var(--ink);}
.body{flex:1 1 0;min-height:0;overflow-y:auto;padding:4px 18px 12px;scrollbar-width:none;}
.body::-webkit-scrollbar{display:none;}
/* tabbar */
.tabbar{height:64px;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;flex:none;padding-bottom:6px;}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;color:var(--faint);text-decoration:none;transition:color .2s;}
.tabbar a.on{color:var(--navy);font-weight:700;}
.tabbar svg{width:22px;height:22px;}
/* atoms */
h4{font-size:15px;font-weight:700;}
.mut{color:var(--mut);} .small{font-size:11.5px;}
.card{background:#fff;border-radius:18px;box-shadow:var(--sh1);padding:16px;margin-bottom:12px;}
.btn{border:0;font-family:inherit;font-weight:700;border-radius:22px;height:46px;display:flex;align-items:center;justify-content:center;gap:7px;font-size:15px;cursor:pointer;text-decoration:none;transition:transform .13s,box-shadow .22s,background .2s;}
.btn:active{transform:scale(.97);}
.btn.navy{background:var(--navy);color:#fff;box-shadow:0 5px 16px rgba(0,38,97,.22);}
.btn.navy:hover{background:var(--navy-700);}
.btn.berry{background:var(--berry);color:#fff;}
.btn.ghost{background:#fff;border:1.5px solid var(--navy);color:var(--navy);}
.btn.quiet{background:var(--navy-50);color:var(--navy);}
.btn.sm{height:36px;font-size:13px;border-radius:18px;padding:0 16px;}
.btn.block{width:100%;}
.st{font-size:11px;font-weight:600;border-radius:7px;padding:3px 9px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;}
.st .d{width:6px;height:6px;border-radius:50%;background:currentColor;}
.st.g{background:var(--green-bg);color:var(--green);}.st.a{background:var(--amber-bg);color:var(--amber);}
.st.r{background:var(--red-bg);color:var(--red);}.st.b{background:var(--blue-bg);color:var(--blue);}.st.p{background:var(--purple-bg);color:var(--purple);}
.st.n{background:var(--line-2);color:var(--mut);}
.chip{font-size:12px;border:1px solid var(--line);background:#fff;color:var(--mut);border-radius:16px;padding:6px 13px;display:inline-block;}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy);}
.appbar{display:flex;align-items:center;gap:10px;padding:6px 2px 12px;}
.appbar .bk{width:36px;height:36px;border-radius:50%;background:#fff;box-shadow:var(--sh1);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;}
.appbar .tt{font-size:17px;font-weight:700;flex:1;}
.sec-t{font-size:13px;font-weight:700;margin:16px 2px 10px;color:var(--ink);}
.cta-bar{background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:10px 16px 14px;display:flex;gap:9px;flex:none;}
.gradband{background:var(--grad);background-size:170% 170%;animation:drift 16s ease-in-out infinite alternate;color:#fff;border-radius:20px;padding:18px;box-shadow:0 12px 28px rgba(94,36,107,.25);}
@keyframes drift{0%{background-position:0 30%}100%{background-position:100% 70%}}
.fee-tbl{width:100%;border-collapse:collapse;font-size:12px;}
.fee-tbl th{color:var(--faint);font-weight:600;text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);font-size:10.5px;}
.fee-tbl td{padding:9px 6px;border-bottom:1px solid var(--line-2);color:var(--ink);}
.fee-tbl tr:last-child td{border-bottom:0;}
.steps{display:flex;align-items:center;gap:4px;margin:4px 0 14px;}
.steps .s{width:24px;height:24px;border-radius:50%;background:var(--line-2);color:var(--faint);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;}
.steps .s.on{background:var(--navy);color:#fff;}
.steps .s.done{background:var(--green);color:#fff;}
.steps .bar{flex:1;height:2px;background:var(--line);}
.steps .bar.done{background:var(--green);}
.tli{display:flex;gap:12px;position:relative;padding-bottom:16px;}
.tli .rail{display:flex;flex-direction:column;align-items:center;width:12px;flex:none;}
.tli .dot{width:11px;height:11px;border-radius:50%;margin-top:4px;z-index:1;}
.tli .vl{position:absolute;left:5px;top:18px;bottom:0;width:2px;background:var(--line);}
.tli:last-child .vl{display:none;}
.tli .tc{flex:1;background:#fff;border:1px solid var(--line);border-radius:13px;padding:10px 12px;box-shadow:var(--sh1);}
.tli .tt{font-size:13px;font-weight:700;display:flex;gap:7px;align-items:center;flex-wrap:wrap;}
.tli .td{font-size:11.5px;color:var(--mut);margin-top:4px;line-height:1.6;}
.qopt{border:1.5px solid var(--line);border-radius:13px;padding:13px 14px;font-size:13.5px;margin-bottom:9px;display:flex;align-items:center;gap:10px;cursor:pointer;transition:border-color .15s,background .15s;background:#fff;}
.qopt.on{border-color:var(--navy);background:var(--navy-50);font-weight:600;}
.qopt .rd{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;}
.qopt.on .rd{border-color:var(--navy);} .qopt.on .rd::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--navy);}
.mat-row{display:flex;align-items:center;gap:11px;padding:12px 4px;border-bottom:1px solid var(--line-2);}
.mat-row .mi{width:34px;height:34px;border-radius:10px;background:var(--navy-50);color:var(--navy);display:flex;align-items:center;justify-content:center;flex:none;}
.mat-row .mt{flex:1;} .mat-row .mt b{font-size:13.5px;display:block;} .mat-row .mt span{font-size:11px;color:var(--faint);}
.gate{border:1.5px dashed #B9847C;background:var(--red-bg);border-radius:13px;padding:13px 14px;font-size:12px;color:#8a261c;line-height:1.7;}
.proj-row{display:flex;gap:11px;align-items:center;background:#fff;border-radius:15px;padding:13px;margin-bottom:9px;box-shadow:var(--sh1);cursor:pointer;transition:transform .15s var(--ease-out);}
.proj-row:active{transform:scale(.985);}
.proj-row .flag{width:40px;height:40px;border-radius:12px;background:var(--navy-50);display:flex;align-items:center;justify-content:center;flex:none;color:var(--navy);}
.qgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:12px 0;}
.qgrid .q{background:#fff;border-radius:14px;box-shadow:var(--sh1);height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:10.5px;color:var(--mut);cursor:pointer;transition:transform .15s;}
.qgrid .q:active{transform:scale(.94);}
.qgrid .q i{width:21px;height:21px;border-radius:7px;background:var(--navy-100);display:block;}
.hintbar{background:var(--amber-bg);border-radius:13px;padding:11px 13px;font-size:11.5px;color:#8a5a1e;line-height:1.6;display:flex;gap:9px;align-items:flex-start;margin-bottom:12px;}
.fade-up{animation:fadeUp .34s var(--ease-out) both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.devnote{max-width:760px;margin:26px auto 0;background:#fff;border:1px dashed var(--line);border-radius:14px;padding:16px 20px;font-size:12px;color:var(--mut);line-height:2;}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important;}}
</style>
</head>

/* render */
const root=document.getElementById('root');
Object.keys(V).forEach(k=>{const w=document.createElement('div');w.innerHTML=V[k];root.appendChild(w.firstElementChild);});
let hist=['login'];
function go(k,push){const el=document.getElementById('v-'+k);if(!el)return;
 document.querySelectorAll('.view').forEach(v=>v.classList.remove('on','back'));
 el.classList.add('on');if(push!==false&&hist[hist.length-1]!==k)hist.push(k);
 const b=el.querySelector('.body');if(b)b.scrollTop=0;
}
let toastT;function toast(m){let t=document.getElementById('utoast');if(!t){t=document.createElement('div');t.id='utoast';t.style.cssText='position:absolute;left:50%;bottom:96px;transform:translate(-50%,140%);background:#1B2433;color:#fff;font-size:13px;padding:12px 20px;border-radius:24px;box-shadow:0 8px 28px rgba(0,0,0,.3);z-index:50;transition:transform .34s cubic-bezier(.34,1.3,.5,1);max-width:300px;text-align:center;';document.querySelector('.screen').appendChild(t);}t.textContent=m;t.style.transform='translate(-50%,0)';clearTimeout(toastT);toastT=setTimeout(()=>t.style.transform='translate(-50%,140%)',1900);}
function qpick(el){[...el.parentNode.children].forEach(c=>c.classList.remove('on'));el.classList.add('on');}
document.addEventListener('click',e=>{
 const g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return;}
 const tt=e.target.closest('[data-toast]');if(tt){toast(tt.dataset.toast);return;}
 const q=e.target.closest('.qopt');if(q)qpick(q);
});
go('login',false);
</script>
