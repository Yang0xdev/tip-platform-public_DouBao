<style>
:root{
  --navy:#002661;--navy-700:#1E3E78;--navy-100:#DCE4F2;--navy-50:#EDF1F8;--berry:#AF2D67;--berry-50:#FAEEF4;
  --ink:#1B2433;--mut:#5E6B7E;--faint:#8A95A6;--line:#E5E9F0;--line-2:#F0F3F8;--paper:#F5F7FA;
  --green:#177A5B;--green-bg:#E6F4EE;--amber:#B45309;--amber-bg:#FBF1E2;--red:#C03221;--red-bg:#FCEBEA;--blue:#1D5F8A;--blue-bg:#E9F2F8;--purple:#6B5AA8;--purple-bg:#EFECF7;
  --sh1:0 1px 2px rgba(16,32,67,.05),0 4px 14px rgba(16,32,67,.06);

*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased;}
body{font-family:"Manrope","Noto Sans SC",-apple-system,"PingFang SC",sans-serif;background:#E9EDF3;color:var(--ink);min-height:100vh;}
.stage{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:34px 16px 60px;}
.stage-head{text-align:center;margin-bottom:22px;}
.stage-head h1{font-size:20px;font-weight:800;}
.stage-head p{font-size:12.5px;color:var(--mut);margin-top:6px;line-height:1.7;}
.pill{display:inline-block;font-size:11px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:4px 12px;color:var(--mut);margin-top:8px;}
.phone{width:390px;height:800px;border-radius:42px;background:#11262B;padding:11px;box-shadow:0 30px 70px rgba(10,25,60,.35);position:relative;flex:none;}
.screens{position:absolute;inset:11px;border-radius:32px;overflow:hidden;}
.view{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--paper);overflow:hidden;opacity:0;pointer-events:none;transform:translateX(28px);transition:transform .34s var(--ease-out),opacity .26s var(--ease-out);}
.view.on{opacity:1;pointer-events:auto;transform:none;z-index:2;}
.sb{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:12px;font-weight:600;}
.body{flex:1 1 0;min-height:0;overflow-y:auto;padding:4px 16px 14px;scrollbar-width:none;}
.body::-webkit-scrollbar{display:none;}
.tabbar{height:64px;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;flex:none;padding-bottom:6px;}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;color:var(--faint);text-decoration:none;}
.tabbar a.on{color:var(--navy);font-weight:700;}
.tabbar svg{width:22px;height:22px;}
h4{font-size:15px;font-weight:700;}
.mut{color:var(--mut);}.small{font-size:11.5px;}
.card{background:#fff;border-radius:18px;box-shadow:var(--sh1);padding:15px;margin-bottom:11px;}
.btn{border:0;font-family:inherit;font-weight:700;border-radius:22px;height:44px;display:flex;align-items:center;justify-content:center;gap:7px;font-size:14.5px;cursor:pointer;text-decoration:none;transition:transform .13s,background .2s;}
.btn:active{transform:scale(.97);}
.btn.navy{background:var(--navy);color:#fff;box-shadow:0 5px 16px rgba(0,38,97,.2);}
.btn.ghost{background:#fff;border:1.5px solid var(--navy);color:var(--navy);}
.btn.quiet{background:var(--navy-50);color:var(--navy);}
.btn.sm{height:35px;font-size:12.5px;border-radius:18px;padding:0 15px;}
.btn.block{width:100%;}
.st{font-size:10.5px;font-weight:600;border-radius:7px;padding:3px 8px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;}
.st .d{width:6px;height:6px;border-radius:50%;background:currentColor;}
.st.g{background:var(--green-bg);color:var(--green);}.st.a{background:var(--amber-bg);color:var(--amber);}
.st.r{background:var(--red-bg);color:var(--red);}.st.b{background:var(--blue-bg);color:var(--blue);}.st.p{background:var(--purple-bg);color:var(--purple);}
.st.n{background:var(--line-2);color:var(--mut);}
.chip{font-size:11.5px;border:1px solid var(--line);background:#fff;color:var(--mut);border-radius:16px;padding:6px 12px;display:inline-block;}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy);}
.appbar{display:flex;align-items:center;gap:10px;padding:6px 2px 12px;}
.appbar .bk{width:34px;height:34px;border-radius:50%;background:#fff;box-shadow:var(--sh1);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;}
.appbar .tt{font-size:17px;font-weight:700;flex:1;}
.sec-t{font-size:13px;font-weight:700;margin:15px 2px 9px;}
.cta-bar{background:rgba(255,255,255,.95);border-top:1px solid var(--line);padding:10px 16px 14px;display:flex;gap:9px;flex:none;}
.fee-tbl{width:100%;border-collapse:collapse;font-size:12px;}
.fee-tbl th{color:var(--faint);font-weight:600;text-align:left;padding:7px 5px;border-bottom:1px solid var(--line);font-size:10.5px;}
.fee-tbl td{padding:9px 5px;border-bottom:1px solid var(--line-2);}
.fee-tbl tr:last-child td{border-bottom:0;}
.row{display:flex;align-items:center;gap:11px;padding:12px 4px;border-bottom:1px solid var(--line-2);}
.row:last-child{border-bottom:0;}
.row .mi{width:36px;height:36px;border-radius:11px;background:var(--navy-50);color:var(--navy);display:flex;align-items:center;justify-content:center;flex:none;}
.row .mt{flex:1;}.row .mt b{font-size:13.5px;display:block;}.row .mt span{font-size:11px;color:var(--faint);display:block;margin-top:2px;line-height:1.5;}
.proj-row{display:flex;gap:11px;align-items:center;background:#fff;border-radius:15px;padding:13px;margin-bottom:9px;box-shadow:var(--sh1);cursor:pointer;}
.flag{width:40px;height:40px;border-radius:12px;background:var(--navy-50);display:flex;align-items:center;justify-content:center;flex:none;color:var(--navy);}
.tli{display:flex;gap:12px;position:relative;padding-bottom:15px;}
.tli .rail{display:flex;flex-direction:column;align-items:center;width:12px;flex:none;}
.tli .dot{width:11px;height:11px;border-radius:50%;margin-top:4px;z-index:1;}
.tli .vl{position:absolute;left:5px;top:18px;bottom:0;width:2px;background:var(--line);}
.tli:last-child .vl{display:none;}
.tli .tc{flex:1;background:#fff;border:1px solid var(--line);border-radius:13px;padding:10px 12px;box-shadow:var(--sh1);}
.tli .tt{font-size:13px;font-weight:700;display:flex;gap:7px;align-items:center;flex-wrap:wrap;}
.tli .td{font-size:11.5px;color:var(--mut);margin-top:4px;line-height:1.6;}
.gate{border:1.5px dashed #B9847C;background:var(--red-bg);border-radius:13px;padding:13px 14px;font-size:12px;color:#8a261c;line-height:1.7;}
.note{background:var(--navy-50);border-radius:13px;padding:11px 13px;font-size:11.5px;color:var(--navy);line-height:1.7;display:flex;gap:9px;align-items:flex-start;margin-bottom:11px;}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:11px;}
.kpi{background:#fff;border-radius:14px;box-shadow:var(--sh1);padding:12px 10px;text-align:center;}
.kpi b{font-size:20px;font-weight:800;display:block;color:var(--navy);}.kpi span{font-size:10.5px;color:var(--faint);}
.flow{display:flex;align-items:stretch;gap:0;overflow-x:auto;padding-bottom:6px;scrollbar-width:none;}
.flow::-webkit-scrollbar{display:none;}
.fstep{flex:none;width:96px;text-align:center;position:relative;}
.fstep .n{width:30px;height:30px;border-radius:50%;background:var(--line-2);color:var(--faint);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin:0 auto 6px;z-index:1;position:relative;}
.fstep.on .n{background:var(--navy);color:#fff;}.fstep.done .n{background:var(--green);color:#fff;}
.fstep .l{font-size:10px;color:var(--mut);line-height:1.4;}
.fstep:not(:last-child)::after{content:"";position:absolute;top:15px;left:60%;width:80%;height:2px;background:var(--line);z-index:0;}
.fstep.done:not(:last-child)::after{background:var(--green);}
.ck{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line-2);font-size:12.5px;line-height:1.6;}
.ck:last-child{border-bottom:0;}
.ck .box{width:20px;height:20px;border-radius:6px;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;margin-top:1px;}
.ck.y .box{background:var(--navy);border-color:var(--navy);color:#fff;}
.fade-up{animation:fadeUp .34s var(--ease-out) both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.devnote{max-width:760px;margin:26px auto 0;background:#fff;border:1px dashed var(--line);border-radius:14px;padding:16px 20px;font-size:12px;color:var(--mut);line-height:2;}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important;}}
</style>
</head>
<body>

</div>

let toastT;function toast(m){let t=document.getElementById('utoast');if(!t){t=document.createElement('div');t.id='utoast';t.style.cssText='position:absolute;left:50%;bottom:96px;transform:translate(-50%,140%);background:#1B2433;color:#fff;font-size:13px;padding:12px 20px;border-radius:24px;box-shadow:0 8px 28px rgba(0,0,0,.3);z-index:50;transition:transform .34s cubic-bezier(.34,1.3,.5,1);max-width:300px;text-align:center;';document.querySelector('.screens').appendChild(t);}t.textContent=m;t.style.transform='translate(-50%,0)';clearTimeout(toastT);toastT=setTimeout(()=>t.style.transform='translate(-50%,140%)',1900);}
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return;}const tt=e.target.closest('[data-toast]');if(tt)toast(tt.dataset.toast);});
go('onboard');
</script>
</body>
</html>
