<title>顾问展业端高保真 · v1.8（含 AI · 27 屏）</title>

<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
:root{
  --navy:#002661;--navy-700:#1E3E78;--navy-100:#DCE4F2;--navy-50:#EDF1F8;--berry:#AF2D67;--berry-50:#FAEEF4;--grad:linear-gradient(132deg,#AF2D67 0%,#5E246B 46%,#002661 100%);
  --ink:#1B2433;--mut:#5E6B7E;--faint:#8A95A6;--line:#E5E9F0;--line-2:#F0F3F8;--paper:#F5F7FA;
  --green:#177A5B;--green-bg:#E6F4EE;--amber:#B45309;--amber-bg:#FBF1E2;--red:#C03221;--red-bg:#FCEBEA;--blue:#1D5F8A;--blue-bg:#E9F2F8;--purple:#6B5AA8;--purple-bg:#EFECF7;
  --sh1:0 1px 2px rgba(16,32,67,.05),0 6px 18px -8px rgba(16,32,67,.12);--sh2:0 2px 6px rgba(16,32,67,.05),0 20px 44px -14px rgba(15,35,80,.22);
  --ease-out:cubic-bezier(.16,1,.3,1);--spring:cubic-bezier(.34,1.3,.5,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased;}
body{font-family:"Manrope","Noto Sans SC",-apple-system,"PingFang SC",sans-serif;background:#E9EDF3;color:var(--ink);min-height:100vh;}
.stage{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:34px 16px 60px;}
.stage-head{text-align:center;margin-bottom:22px;}
.stage-head h1{font-size:20px;font-weight:800;}
.stage-head p{font-size:12.5px;color:var(--mut);margin-top:6px;line-height:1.7;}
.pill{display:inline-block;font-size:11px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:4px 12px;color:var(--mut);margin-top:8px;}
.phone{width:390px;height:800px;border-radius:42px;background:#11262B;padding:11px;box-shadow:0 30px 70px rgba(10,25,60,.35);position:relative;flex:none;}
.screens{position:absolute;inset:11px;border-radius:32px;overflow:hidden;}
.view{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--paper);overflow:hidden;opacity:0;pointer-events:none;transform:translateX(30px) scale(.985);transition:transform .42s cubic-bezier(.22,1,.36,1),opacity .3s ease;will-change:transform,opacity;}
.view.on{opacity:1;pointer-events:auto;transform:none;z-index:2;}
.sb{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:12px;font-weight:600;}
.body{flex:1 1 0;min-height:0;overflow-y:auto;padding:4px 16px 14px;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
.body::-webkit-scrollbar{display:none;}
.tabbar{height:64px;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;flex:none;padding-bottom:6px;}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;color:var(--faint);text-decoration:none;position:relative;transition:color .25s,transform .2s var(--spring);}.tabbar a::before{content:'';position:absolute;top:2px;left:50%;width:48px;height:30px;border-radius:15px;background:var(--navy-50);transform:translateX(-50%) scale(.5);opacity:0;transition:transform .32s var(--spring),opacity .25s;z-index:0;}.tabbar a.on::before{opacity:1;transform:translateX(-50%) scale(1);}.tabbar a svg,.tabbar a span{position:relative;z-index:1;}.tabbar svg{transition:transform .32s var(--spring);}.tabbar a.on svg{transform:scale(1.14) translateY(-1px);}.tabbar a:active{transform:scale(.88);}
.tabbar a.on{color:var(--navy);font-weight:700;}
.tabbar svg{width:22px;height:22px;}
h4{font-size:15px;font-weight:700;}
.mut{color:var(--mut);}.small{font-size:11.5px;}
.card{background:#fff;border-radius:18px;box-shadow:var(--sh1);padding:15px;margin-bottom:11px;}
.btn{border:0;font-family:inherit;font-weight:700;border-radius:22px;height:44px;display:flex;align-items:center;justify-content:center;gap:7px;font-size:14.5px;cursor:pointer;text-decoration:none;transition:transform .18s var(--spring),box-shadow .25s,filter .2s;}
.btn:active{transform:scale(.962);}
.btn.navy{background:linear-gradient(180deg,#0B3A82 0%,#002661 100%);color:#fff;box-shadow:0 6px 18px rgba(0,38,97,.24),inset 0 1px 0 rgba(255,255,255,.16);}
.btn.ghost{background:#fff;border:1.5px solid var(--navy);color:var(--navy);}
.btn.quiet{background:var(--navy-50);color:var(--navy);}
.btn.sm{height:35px;font-size:12.5px;border-radius:18px;padding:0 15px;}
.btn.block{width:100%;}
.st{font-size:10.5px;font-weight:600;border-radius:7px;padding:3px 8px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;}
.st .d{width:6px;height:6px;border-radius:50%;background:currentColor;}
.st.g{background:var(--green-bg);color:var(--green);}.st.a{background:var(--amber-bg);color:var(--amber);}
.st.r{background:var(--red-bg);color:var(--red);}.st.b{background:var(--blue-bg);color:var(--blue);}.st.p{background:var(--purple-bg);color:var(--purple);}
.st.n{background:var(--line-2);color:var(--mut);}
.chip{font-size:11.5px;border:1px solid var(--line);background:#fff;color:var(--mut);border-radius:16px;padding:6px 12px;display:inline-block;transition:background .18s,color .18s,border-color .18s,transform .15s var(--spring);cursor:pointer;}.chip:active{transform:scale(.94);}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy);}
.appbar{display:flex;align-items:center;gap:10px;padding:6px 2px 12px;}
.appbar .bk{width:34px;height:34px;border-radius:50%;background:#fff;box-shadow:var(--sh1);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;transition:transform .15s var(--spring);}.appbar .bk:active{transform:scale(.88);}
.appbar .tt{font-size:17px;font-weight:700;flex:1;}
.sec-t{font-size:13px;font-weight:700;margin:15px 2px 9px;}
.cta-bar{background:rgba(255,255,255,.95);border-top:1px solid var(--line);padding:10px 16px 14px;display:flex;gap:9px;flex:none;}
.fee-tbl{width:100%;border-collapse:collapse;font-size:12px;}
.fee-tbl th{color:var(--faint);font-weight:600;text-align:left;padding:7px 5px;border-bottom:1px solid var(--line);font-size:10.5px;}
.fee-tbl td{padding:9px 5px;border-bottom:1px solid var(--line-2);}
.fee-tbl tr:last-child td{border-bottom:0;}
.row{display:flex;align-items:center;gap:11px;padding:12px 4px;border-bottom:1px solid var(--line-2);}
.row:last-child{border-bottom:0;}
.row .mi{width:36px;height:36px;border-radius:11px;background:var(--navy-50);color:var(--navy);display:flex;align-items:center;justify-content:center;flex:none;}
.row .mt{flex:1;}.row .mt b{font-size:13.5px;display:block;}.row .mt span{font-size:11px;color:var(--faint);display:block;margin-top:2px;line-height:1.5;}
.proj-row{display:flex;gap:11px;align-items:center;background:#fff;border-radius:15px;padding:13px;margin-bottom:9px;box-shadow:var(--sh1);cursor:pointer;transition:transform .22s var(--ease-out),box-shadow .25s;}.proj-row:hover{transform:translateY(-1px);box-shadow:var(--sh2);}.proj-row:active{transform:scale(.98);}
.flag{width:40px;height:40px;border-radius:12px;background:var(--navy-50);display:flex;align-items:center;justify-content:center;flex:none;color:var(--navy);}
.tli{display:flex;gap:12px;position:relative;padding-bottom:15px;}
.tli .rail{display:flex;flex-direction:column;align-items:center;width:12px;flex:none;}
.tli .dot{width:11px;height:11px;border-radius:50%;margin-top:4px;z-index:1;}
.tli .vl{position:absolute;left:5px;top:18px;bottom:0;width:2px;background:var(--line);}
.tli:last-child .vl{display:none;}
.tli .tc{flex:1;background:#fff;border:1px solid var(--line);border-radius:13px;padding:10px 12px;box-shadow:var(--sh1);}
.tli .tt{font-size:13px;font-weight:700;display:flex;gap:7px;align-items:center;flex-wrap:wrap;}
.tli .td{font-size:11.5px;color:var(--mut);margin-top:4px;line-height:1.6;}
.gate{border:1.5px dashed #B9847C;background:var(--red-bg);border-radius:13px;padding:13px 14px;font-size:12px;color:#8a261c;line-height:1.7;}
.note{background:var(--navy-50);border-radius:13px;padding:11px 13px;font-size:11.5px;color:var(--navy);line-height:1.7;display:flex;gap:9px;align-items:flex-start;margin-bottom:11px;}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:11px;}
.kpi{background:#fff;border-radius:14px;box-shadow:var(--sh1);padding:12px 10px;text-align:center;}
.kpi b{font-size:20px;font-weight:800;display:block;color:var(--navy);}.kpi span{font-size:10.5px;color:var(--faint);}
.flow{display:flex;align-items:stretch;gap:0;padding-bottom:6px;}
.flow::-webkit-scrollbar{display:none;}
.fstep{flex:1 1 0;min-width:0;text-align:center;position:relative;}
.fstep .n{width:30px;height:30px;border-radius:50%;background:var(--line-2);color:var(--faint);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin:0 auto 6px;z-index:1;position:relative;}
.fstep.on .n{background:var(--navy);color:#fff;}.fstep.done .n{background:var(--green);color:#fff;}
.fstep .l{font-size:9.5px;color:var(--mut);line-height:1.35;}
.fstep:not(:last-child)::after{content:"";position:absolute;top:15px;left:50%;width:100%;height:2px;background:var(--line);z-index:0;}
.fstep.done:not(:last-child)::after{background:var(--green);}
.ck{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line-2);font-size:12.5px;line-height:1.6;}
.ck:last-child{border-bottom:0;}
.ck .box{width:20px;height:20px;border-radius:6px;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;margin-top:1px;}
.ck.y .box{background:var(--navy);border-color:var(--navy);color:#fff;}
.fade-up{animation:fadeUp .34s var(--ease-out) both;}
@keyframes drift{0%{background-position:0 30%}100%{background-position:100% 70%}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.devnote{max-width:760px;margin:26px auto 0;background:#fff;border:1px dashed var(--line);border-radius:14px;padding:16px 20px;font-size:12px;color:var(--mut);line-height:2;}

/* ===== v1.3 高级动效层 ===== */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes tabIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(192,50,33,.38)}70%{box-shadow:0 0 0 7px rgba(192,50,33,0)}100%{box-shadow:0 0 0 0 rgba(192,50,33,0)}}
.view.on .sb{animation:fadeIn .35s ease both;}
.view.on .body>*{animation:fadeIn .5s var(--ease-out) both;}
.view.on .body>*:not(.proj-row):not([data-go]):not(.cta-bar):not(.btn){animation:rise .55s var(--ease-out) both;}
.view.on .body>*:nth-child(1){animation-delay:.02s}.view.on .body>*:nth-child(2){animation-delay:.06s}
.view.on .body>*:nth-child(3){animation-delay:.10s}.view.on .body>*:nth-child(4){animation-delay:.14s}
.view.on .body>*:nth-child(5){animation-delay:.18s}.view.on .body>*:nth-child(6){animation-delay:.22s}
.view.on .body>*:nth-child(7){animation-delay:.26s}.view.on .body>*:nth-child(8){animation-delay:.30s}
.view.on .body>*:nth-child(9){animation-delay:.34s}.view.on .body>*:nth-child(10){animation-delay:.38s}
.view.on .tabbar{animation:tabIn .45s var(--ease-out) both;}
.view#v-onboard.on>div:last-child{animation:rise .6s var(--ease-out) both;}
.kpi{transition:transform .2s var(--ease-out),box-shadow .25s;}.kpi:hover{transform:translateY(-1px);box-shadow:var(--sh2);}
.gate .d,.st.r .d{animation:pulse 1.8s ease-out infinite;}
.ck .box{transition:transform .15s var(--spring);}.ck:active .box{transform:scale(.9);}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important;}}

/* ================= v1.4 精修层（2026-09-29） ================= */
:root{--grad:linear-gradient(132deg,#AF2D67 0%,#5E246B 46%,#002661 100%);}
@keyframes drift{0%{background-position:0 30%}100%{background-position:100% 70%}}
::selection{background:#DCE4F2;color:#002661;}
a,button{outline:none;}
a:focus-visible,button:focus-visible,.btn:focus-visible{outline:2.5px solid #AF2D67;outline-offset:2px;}
.card{transition:transform .28s cubic-bezier(.16,1,.3,1),box-shadow .28s;}
.card:hover{transform:translateY(-2px);box-shadow:var(--sh2);}
.card:active{transform:scale(.992);}
.btn{position:relative;overflow:hidden;}
.btn.navy::before,.btn.berry::before{content:"";position:absolute;top:0;left:-70%;width:50%;height:100%;
 background:linear-gradient(100deg,transparent,rgba(255,255,255,.3),transparent);transform:skewX(-18deg);
 transition:left .65s ease;pointer-events:none;}
.btn.navy:hover::before,.btn.berry:hover::before{left:135%;}
.skeleton{position:relative;overflow:hidden;background:#EEF1F6;border-radius:12px;}
.skeleton::after{content:"";position:absolute;inset:0;transform:translateX(-100%);
 background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);animation:shimmer14 1.5s infinite;}
@keyframes shimmer14{100%{transform:translateX(100%);}}
.statebox{display:flex;flex-direction:column;align-items:center;gap:9px;padding:34px 20px;text-align:center;
 color:var(--mut);font-size:12.5px;line-height:1.7;}
.statebox .si{width:48px;height:48px;border-radius:15px;background:var(--navy-50);color:var(--navy);
 display:flex;align-items:center;justify-content:center;}
.gradline{height:2px;border:0;border-radius:2px;background:var(--grad);background-size:200% 200%;
 animation:drift 16s ease-in-out infinite alternate;}
@media(prefers-reduced-motion:reduce){.skeleton::after,.gradline{animation:none!important;}}
/* ===== AI 并入层（v1.8）：中央 orb + AI 展业工作台 ===== */
.btn.fill{padding:0 14px;height:34px;}
.h-title{font-size:16px;font-weight:800;color:var(--ink);}
.h-sub{font-size:11.5px;color:var(--faint);margin-top:3px;line-height:1.7;}
.tabbar .orb{position:absolute;top:-23px;left:50%;transform:translateX(-50%);width:58px;height:58px;border-radius:50%;

 max-width:82%;margin-left:auto;line-height:1.7;}

 box-shadow:var(--sh1);line-height:1.8;}

.bub b{font-weight:800;}

document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return;}const tt=e.target.closest('[data-toast]');if(tt)toast(tt.dataset.toast);});
