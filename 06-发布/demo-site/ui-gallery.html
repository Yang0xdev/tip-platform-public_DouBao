<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UI 页面总览 · 透明身份规划平台</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23AF2D67'/%3E%3Cstop offset='1' stop-color='%23002661'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
:root{--navy:#002661;--navy-50:#EDF1F8;--berry:#AF2D67;--berry-50:#FAEEF4;--grad:linear-gradient(132deg,#AF2D67 0%,#5E246B 46%,#002661 100%);
--ink:#1B2433;--mut:#5E6B7E;--faint:#8A95A6;--line:#E5E9F0;
--sh1:0 1px 2px rgba(16,32,67,.05),0 6px 18px -8px rgba(16,32,67,.12);}
*{box-sizing:border-box;margin:0;-webkit-font-smoothing:antialiased}
html,body{height:100%}
body{font-family:"Manrope","Noto Sans SC",-apple-system,"PingFang SC",sans-serif;background:#E9EDF3;color:var(--ink);display:flex;flex-direction:column;overflow:hidden}
.top{background:#fff;border-bottom:1px solid var(--line);padding:12px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px}
.logo{width:32px;height:32px;border-radius:9px;background:var(--grad);display:flex;align-items:center;justify-content:center;color:#fff}
.ends{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.ends button{height:36px;padding:0 15px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:12.5px;font-weight:700;color:var(--mut);cursor:pointer;transition:.2s}
.ends button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.ends button .n{opacity:.65;font-weight:600;margin-left:5px}
.main{flex:1;display:flex;min-height:0}
.side{width:232px;background:#fff;border-right:1px solid var(--line);overflow-y:auto;padding:12px;flex:none}
.side .hint{font-size:11.5px;color:var(--faint);line-height:1.8;padding:8px 10px}
.side button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:none;background:transparent;padding:9px 10px;border-radius:12px;font-size:12.5px;font-weight:600;color:var(--ink);cursor:pointer;transition:.15s}
.side button .idx{font-family:ui-monospace,monospace;font-size:10.5px;color:var(--faint);width:22px;flex:none}
.side button:hover{background:var(--navy-50)}
.side button.on{background:var(--navy);color:#fff}
.side button.on .idx{color:rgba(255,255,255,.7)}
.stage{flex:1;min-width:0;position:relative;background:#DDE3EC}
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#E9EDF3;display:none}
.stage iframe.on{display:block}
.stage .loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:13px}
a.back{font-size:12px;color:var(--mut);text-decoration:none;font-weight:600}
a.back:hover{color:var(--navy)}
@media(max-width:860px){.side{width:150px}.ends{margin-left:0}}
</style>
</head>
<body>
<div class="top">
  <div class="brand"><span class="logo"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg></span>UI 页面总览<span style="font-size:11px;color:var(--faint);font-weight:600">Freeze v1.3 · 全部为虚构示例</span></div>
  <a class="back" href="/">‹ 返回演示首页</a>
  <div class="ends" id="ends"></div>
</div>
<div class="main">
  <div class="side" id="side"></div>
  <div class="stage" id="stage"><div class="loading" id="loading">请选择端与页面…</div></div>
</div>

<script>
var ENDS=[
 {key:'client',name:'客户端',src:'client.html',screens:[
  ['login','启动 · 登录'],['home','首页'],['projects','找项目'],['project','项目详情'],
  ['assessment','初步评估问卷'],['assessmentResult','初评结果'],['proposal','方案确认'],['order','订单与合同'],
  ['cases','我的办理'],['progress','进度时间线'],['global','全球通行'],['passport','我的护照'],
  ['visa','签证要求'],['passportCompare','护照对比排名'],['services','服务目录'],['ticketCreate','提交工单'],
  ['ticketDetail','工单详情'],['messages','消息中心'],['me','我的'],['accessLog','授权访问记录'],
  ['family','家庭授权'],['compare','项目比较'],['education','防骗教育'],['advisorCard','顾问名片']]},
 {key:'advisor',name:'顾问手机',src:'advisor.html',screens:[
  ['onboard','顾问入驻'],['wb','展业工作台'],['market','项目市场'],['project','项目详情'],
  ['authorize','授权申请'],['share','分享素材'],['clients','我的客户'],['client','客户详情三页签'],
  ['order','订单与主体门'],['orderblock','阻断原因'],['commission','佣金规则说明'],['learn','学习与考试'],['me','我的']]},
 {key:'ipad',name:'顾问 iPad',src:'advisor-ipad.html',screens:null,hint:'页面内可切换「工作模式 / 客户演示模式」：I-01 需求采集与初评比较、I-02 方案共读与不承诺事项知悉。'},
 {key:'admin',name:'总后台',src:'admin.html',screens:[
  ['home','运营总览'],['matrix','一后台控两端 · 控制矩阵'],['a01','A01 内容治理'],['a02','A02 供给准入'],
  ['a03','A03 顾问管理'],['a04','A04 关系分配'],['a05','A05 报价与合同'],['a06','A06 交付看板'],
  ['a07','A07 财务结算'],['a08','A08 工单投诉'],['a09','A09 通知治理'],['a12','A12 合规工作台'],
  ['a10','A10 权限审计'],['a11','A11 质量基线']]},
 {key:'portal',name:'服务方门户',src:'portal.html',screens:null,hint:'页面内可切换「外部服务方 / 自营交付部」双模式，含 4 个页签：概览、材料批次、受控阅读器、账户与设置。只读、水印、禁下载。'}
];

var endsEl=document.getElementById('ends'),sideEl=document.getElementById('side'),stageEl=document.getElementById('stage');
var loadingEl=document.getElementById('loading');
var frameCache={},cur=null,curScreen={};

ENDS.forEach(function(e){
 var b=document.createElement('button');
 b.innerHTML=e.name+(e.screens?'<span class="n">'+e.screens.length+'</span>':'');
 b.onclick=function(){selectEnd(e.key)};
 b.dataset.key=e.key;
 endsEl.appendChild(b);
});

function selectEnd(key){
 cur=key;
 [].forEach.call(endsEl.children,function(b){b.classList.toggle('on',b.dataset.key===key)});
 var e=ENDS.find(function(x){return x.key===key});
 sideEl.innerHTML='';
 if(!e.screens){
  var h=document.createElement('div');h.className='hint';h.textContent=e.hint;sideEl.appendChild(h);
 } else {
  e.screens.forEach(function(s,i){
   var b=document.createElement('button');
   b.innerHTML='<span class="idx">'+String(i+1).padStart(2,'0')+'</span>'+s[1];
   b.onclick=function(){showScreen(s[0],b)};
   b.dataset.k=s[0];
   sideEl.appendChild(b);
  });
 }
 loadingEl.style.display='flex';
 [].forEach.call(stageEl.querySelectorAll('iframe'),function(f){f.classList.remove('on')});
 if(!frameCache[key]){
  var f=document.createElement('iframe');
  f.src=e.src;
  f.dataset.key=key;
  f.onload=function(){
   loadingEl.style.display='none';
   f.classList.add('on');
   if(e.screens&&!curScreen[key]){var first=sideEl.children[0];showScreen(e.screens[0][0],first)}
  };
  stageEl.appendChild(f);frameCache[key]=f;
 } else {
  var ff=frameCache[key];ff.classList.add('on');loadingEl.style.display='none';
 }
}

function showScreen(k,btn){
 var e=ENDS.find(function(x){return x.key===cur});
 [].forEach.call(sideEl.children,function(b){b.classList.remove('on')});
 if(btn)btn.classList.add('on');
 curScreen[cur]=k;
 var f=frameCache[cur];
 if(f&&f.contentWindow&&f.contentWindow.go){
  try{f.contentWindow.go(k)}catch(err){}
 }
}

selectEnd('client');
</script>
</body>
</html>
